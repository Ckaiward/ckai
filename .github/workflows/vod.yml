name: Post VOD
on:
  schedule:
    - cron: "5 15 * * *"   # 16h05 en hiver (UTC+1)
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python post_vod.py
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
